<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151412">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C21F17'/%3E%3Cpath d='M8 12l16-4M8 18l16-4M8 24l16-4' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <!-- Fonts: Google Fonts for now; self-host Archivo and IBM Plex Mono before launch. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./components.css">
  <title>Customise · Er-Han Burger</title>
  <meta name="description" content="Customise your order, watch it come together and add it to your basket.">
  <script src="./app.js" type="module"></script>
</head>
<body class="page-builder">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="appbar">
    <div class="wrap appbar-inner">
      <a class="brand" href="./index.html" aria-label="Er-Han Burger, home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#C21F17"/><path d="M8 12l16-4M8 18l16-4M8 24l16-4" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
        <span class="brand-word">Er-Han <span>Burger</span></span>
      </a>
      <span class="status-pill" data-open-status>Opening hours</span>
      <nav class="appbar-nav" aria-label="Main">
        <a href="./menu.html" data-nav="menu">Menu</a>
        <a href="./product.html" data-nav="build">Build a burger</a>
        <button type="button" class="appbar-basket" id="open-basket" data-open-basket>Basket <span class="appbar-total" data-basket-total>Empty</span><span class="count-badge" data-basket-count hidden>0</span></button>
      </nav>
    </div>
  </header>
  <main id="main" class="builder">
    <div class="builder-head">
      <a class="back-link" id="back-link" href="./menu.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Menu</span></a>
      <div class="builder-title">
        <p class="label" id="product-category">Beef burgers</p>
        <h1 id="product-title" class="display">Half Pounder <em>with Cheese</em></h1>
      </div>
      <p class="builder-price"><output id="basket-total" aria-live="polite">£6.90</output><small id="price-breakdown">Base price</small></p>
    </div>
    <section class="stage" id="stage" aria-label="Preview">
      <span class="pass-rail" aria-hidden="true"></span>
      <p class="stage-ticket" id="choice-status" aria-hidden="true">Tap a choice to add it</p>
      <span class="stage-delta" id="price-delta" aria-hidden="true"></span>
      <ul class="stage-notes" id="stage-notes" aria-hidden="true"></ul>
      <p class="stage-toast" id="basket-feedback" role="status"></p>
      <div class="rig" id="rig" aria-hidden="true">
        <div class="contact"></div>
        <img class="ingredient" data-layer="bottom" src="./assets/scene/bottom.webp" alt="">
        <img class="ingredient" data-layer="patty-a" src="./assets/scene/patty.webp" alt="">
        <img class="ingredient" data-layer="patty-b" src="./assets/scene/patty.webp" alt="">
        <img class="ingredient" data-layer="cheese" src="./assets/scene/cheese.webp" alt="">
        <img class="ingredient" data-layer="lettuce" src="./assets/scene/lettuce.webp" alt="">
        <img class="ingredient" data-layer="tomato" src="./assets/scene/tomato.webp" alt="">
        <img class="ingredient sauce" data-layer="sauce" src="./assets/scene/sauce.webp" alt="">
        <canvas id="stream"></canvas>
        <img class="bottle" id="bottle" src="./assets/scene/bottle.webp" alt="">
        <img class="ingredient top" data-layer="top" src="./assets/scene/top.webp" alt="">
      </div>
      <div class="stage-caption">
        <span id="status" role="status">Your preview</span>
        <button type="button" class="replay" id="replay" aria-label="Replay the build"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg><span>Replay</span></button>
      </div>
    </section>
    <section class="controls" aria-labelledby="controls-title">
      <h2 id="controls-title" class="visually-hidden">Your choices</h2>
      <p class="intro" id="intro"></p>
      <nav class="group-tabs" id="group-tabs" aria-label="Choice groups"></nav>
      <div id="choice-groups"></div>
      <noscript><p>Enable JavaScript to customise your order.</p></noscript>
    </section>
    <div class="order-bar">
      <div class="order-actions">
        <button type="button" class="order-basket" data-open-basket><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21zM9 8h6M9 12h6"/></svg><span class="order-basket-text">Basket<strong data-basket-total>Empty</strong></span><span class="count-badge" data-basket-count hidden>0</span></button>
        <button type="button" class="button button--ghost" id="make-another" hidden>Make another</button>
        <button type="button" class="button order-button" id="add-to-basket"><span id="add-label">Add to basket</span><span class="button-price" id="add-price">£6.90</span></button>
      </div>
    </div>
  </main>
  <nav class="tabbar" aria-label="Quick links">
    <a href="./menu.html" data-nav="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Menu</a>
    <a href="./product.html" data-nav="build"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 5 0 0 1 16 0zM3.5 13.5h17M4 17h16a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/></svg>Build</a>
    <button type="button" class="tabbar-basket" data-open-basket>
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21zM9 8h6M9 12h6"/></svg><span class="count-badge" data-basket-count hidden>0</span></span>
      <span class="tabbar-basket-text">Basket<strong data-basket-total>Empty</strong></span>
    </button>
  </nav>
  <dialog id="basket-dialog" class="basket-dialog" aria-labelledby="basket-heading"></dialog>
</body>
</html>
