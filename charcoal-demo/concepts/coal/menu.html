<html lang="en-GB">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1916">

<title>Menu · Er-Han Burger</title>
<meta name="description" content="The full Er-Han Burger menu: meal deals, burgers, chicken shish, hot dogs, sides and drinks. Halal, grilled to order, collection only.">
</head>
<body class="has-tabbar">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <a class="brand" href="./index.html" aria-label="Er-Han Burger, home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8.5 20.5 14 10M13 23.5 18.5 13M18 25.5 23.5 15.5" stroke="#e8622a" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span class="brand-name">Er-Han <span>Burger</span></span>
  </a>
  <nav class="site-nav" aria-label="Main">
    <a href="./menu.html" aria-current="page">Menu</a>
    <a href="./index.html#how">How it works</a>
    <a href="./index.html#visit">Visit</a>
  </nav>
  <div class="header-end">
    <p class="status"><span data-open-status>Opening hours</span></p>
    <button class="basket-chip" type="button" data-open-basket>Basket <span class="count"><span id="basket-count">0</span></span><span class="visually-hidden"> items</span></button>
  </div>
</header>
<main id="main">
  <div class="wrap menu-head">
    <p class="label">Halal · grilled to order · collection only</p>
    <h1>The menu</h1>
  </div>
  <div class="menu-tools">
    <div class="wrap">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg>
        <label class="visually-hidden" for="menu-search">Search the menu</label>
        <input id="menu-search" type="search" placeholder="Search: cheese, chips, Pepsi…" autocomplete="off">
      </div>
      <nav class="tabs" id="menu-tabs" aria-label="Menu sections"></nav>
    </div>
  </div>
  <div class="wrap" id="menu-sections"></div>
  <p class="wrap menu-empty" id="menu-empty" hidden role="status"></p>
</main>
<footer class="site-footer">
  <div class="wrap">
    <p><strong class="label" style="color:var(--c-text)">Er-Han Burger</strong> · Fresh, grilled, halal · Since 2013 · Brent South Shopping Park, London</p>
    <p>Allergies or dietary needs? Call <a href="tel:07576113811">07576 113811</a> before ordering.</p>
  </div>
</footer>
<nav class="tabbar" aria-label="Quick actions">
  <a href="./menu.html">Menu</a>
  <button type="button" data-open-basket><span>Basket · <span data-basket-total>Empty</span></span><span class="count" aria-hidden="true" data-basket-count>0</span></button>
</nav>
<dialog class="sheet" id="basket-dialog" aria-labelledby="basket-heading"></dialog>
<script type="module" src="./menu.js"></script>
</body>
</html>
