<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151412">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C21F17'/%3E%3Cpath d='M8 12l16-4M8 18l16-4M8 24l16-4' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./concept.css">

<title>Menu · Er-Han Burger</title>
<meta name="description" content="The full Er-Han Burger menu: meal deals, burgers, chicken shish, hot dogs, sides and drinks. Order on WhatsApp for collection.">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="appbar">
  <div class="wrap appbar-inner">
    <a class="brand" href="./index.html" aria-label="Er-Han Burger, home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#C21F17"/><path d="M8 12l16-4M8 18l16-4M8 24l16-4" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      <span class="brand-word">Er-Han<span>.</span></span>
    </a>
    <span class="status-pill" data-open-status>Opening hours</span>
    <nav class="appbar-nav" aria-label="Main">
      <a href="./menu.html" data-tab="menu">Menu</a>
      <a href="./product.html" data-tab="build">Build a burger</a>
      <a href="./menu.html?basket" class="nav-basket" data-open-ticket>Basket <span class="count-badge" data-ticket-count hidden>0</span></a>
    </nav>
  </div>
</header>

<main id="main">
  <div class="wrap menu-top">
    <div class="menu-title"><h1 class="display">Menu</h1><p class="label" data-menu-count></p></div>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <label class="visually-hidden" for="menu-search">Search the menu</label>
      <input id="menu-search" type="search" placeholder="Search burgers, chips, drinks…" autocomplete="off">
    </div>
  </div>
  <div class="chips-bar"><div class="wrap" style="width:min(100%,var(--max))"><nav class="chips" aria-label="Menu sections" data-chips></nav></div></div>
  <div class="wrap menu-shell">
    <div class="menu-layout"><div data-sections></div>
      <div class="empty-search" data-empty hidden><p class="tv-lead">Nothing on the grill by that name.</p><p>Try “chicken”, “chips” or “cola”.</p><button type="button" class="btn btn--ink" data-clear>Clear search</button></div>
      <p class="visually-hidden" role="status" data-search-status></p>
    </div>
    <aside class="ticket-rail" aria-label="Your ticket" data-rail></aside>
  </div>
</main>
<nav class="tabbar" aria-label="App">
  <a href="./menu.html" data-tab="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Menu</a>
  <a href="./product.html" data-tab="build"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 5 0 0 1 16 0zM3.5 13.5h17M4 17h16a0 0 0 0 1 0 0 3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/></svg>Build</a>
  <a href="./menu.html?basket" class="tab-basket" data-open-ticket>
    <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21zM9 8h6M9 12h6"/></svg></span>
    <span class="tab-basket-text">Basket<strong data-ticket-total>Empty</strong></span>
    <span class="count-badge" data-ticket-count hidden>0</span>
  </a>
</nav>

<script type="module" src="./js/menu.js"></script>
</body>
</html>
