<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbf4e3">
<title>Order Counter · Er-Han Burger</title>
<style>
:root{color-scheme:light;--paper:#fbf4e3;--card:#fffaf0;--ink:#10254d;--accent:#2248c7;--line:#c6c7c3;--muted:#505c71}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}button,select{font:inherit;color:inherit}button,select{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:inherit}h1,h2,h3,p{margin:0}img{display:block;max-width:100%}
.masthead{background:var(--paper);border-bottom:1px solid var(--ink);position:sticky;top:0;z-index:5}.mast-inner{max-width:1440px;margin:auto;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:950;text-transform:uppercase;letter-spacing:-.055em;text-decoration:none;font-size:1.35rem}.basket-link{border:1px solid var(--ink);background:transparent;border-radius:4px;padding:8px 14px;font-weight:700;min-height:44px}
.shell{max-width:1440px;margin:auto;padding:34px 5% 70px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;max-width:1100px;margin-bottom:27px}.heading p{max-width:270px;color:var(--muted);padding-bottom:8px}.heading h1{font:700 clamp(3.1rem,7.2vw,7rem)/.87 Georgia,serif;letter-spacing:-.085em}.heading h1 em{color:var(--accent);font-weight:400}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.43fr);gap:24px;align-items:start}.list{min-width:0}.category-picker{display:flex;gap:10px;align-items:center;border-block:1px solid var(--ink);padding:10px 0;margin-bottom:18px}.category-picker label{font:700 1.2rem Georgia,serif}.category-picker select{margin-left:auto;background:var(--card);padding:8px 10px;border:1px solid var(--line);min-height:44px;border-radius:4px}.menu-grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.menu-card{padding:0;border:1px solid var(--line);background:var(--card);border-radius:5px;min-width:0;overflow:hidden;display:grid;text-align:left;grid-template-rows:155px 1fr}.menu-card:hover{border-color:var(--accent);box-shadow:0 1px var(--accent)}.menu-card .photo{display:grid;place-items:center;background:repeating-linear-gradient(-23deg,#e1d9c7,#e1d9c7 1px,#f2e8d4 2px,#f2e8d4 13px);overflow:hidden}.menu-card img{object-fit:contain;width:80%;height:130px;filter:drop-shadow(0 9px 5px #16264b40)}.menu-card .details{padding:13px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.menu-card .name{font:700 1.16rem/1.15 Georgia,serif}.menu-card .price{font-weight:800;color:var(--accent)}
.receipt{background:#e5ebff;border:1px solid var(--ink);padding:20px;border-radius:5px;position:sticky;top:100px}.receipt h2{font:700 1.55rem Georgia,serif;padding-bottom:9px;border-bottom:1px dashed var(--muted);margin-bottom:13px}.receipt p{color:var(--muted)}.receipt-lines{list-style:none;padding:0;margin:0}.receipt-lines li{padding-block:9px;border-bottom:1px solid #b4bfd7;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.receipt-lines small{grid-column:1/-1;color:var(--muted)}.receipt-total{margin-top:18px;display:flex;justify-content:space-between;border-top:1px dashed var(--muted);padding-top:10px;font-weight:850}.receipt[tabindex]:focus{outline:3px solid var(--accent);outline-offset:3px}
dialog{color:var(--ink);background:var(--paper);border:1px solid var(--ink);max-width:min(680px,calc(100% - 26px));width:680px;max-height:calc(100dvh - 32px);border-radius:7px;padding:0;overflow:auto}dialog::backdrop{background:#0c1b40a6}.dialog-head{display:flex;gap:14px;align-items:start;justify-content:space-between;padding:20px;border-bottom:1px solid var(--line)}.dialog-head h2{font:700 clamp(1.5rem,4vw,2.2rem)/1.03 Georgia,serif;letter-spacing:-.03em}.close{background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:4px;min-height:44px}.dialog-body{padding:16px 20px}.builder-preview{float:right;width:34%;height:140px;object-fit:contain;margin:0 0 12px 16px}.options{display:grid;gap:12px}.options fieldset{min-inline-size:0;border:1px solid var(--line);border-radius:5px}.options legend{font-weight:750}.option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px}.option-grid label{display:flex;gap:7px;align-items:flex-start;min-height:38px;padding:5px 0}.option-grid input{margin-top:5px;accent-color:var(--accent)}.option-grid small{white-space:nowrap;color:var(--accent)}.required{color:var(--muted);font-size:.86rem}.dialog-footer{position:sticky;bottom:0;padding:14px 20px;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.dialog-footer output{font-weight:850}.primary{background:var(--accent);color:white;border:0;border-radius:4px;padding:10px 14px;font-weight:750;min-height:44px}.feedback{color:var(--ink);font-weight:650;margin-top:6px}
@media(max-width:760px){.shell{padding:27px 4% 45px}.heading{display:block;margin-bottom:18px}.heading h1{font-size:clamp(2.8rem,11vw,4.4rem);line-height:.9}.heading p{padding-top:8px;padding-bottom:0}.layout{display:block}.receipt{position:static;margin-top:22px}.menu-grid{gap:8px}.menu-card{grid-template-rows:105px 1fr}.menu-card img{height:88px}.menu-card .details{grid-template-columns:1fr;gap:3px;padding:8px}.menu-card .name{font-size:1rem}.option-grid{grid-template-columns:1fr}.builder-preview{height:94px}.mast-inner{padding-inline:4%}.brand{font-size:1.1rem}}
</style>
<header class="masthead"><div class="mast-inner"><a href="#" class="brand">Er-Han Burger</a><button type="button" class="basket-link" id="basket-link">Basket <span id="count">0</span></button></div></header>
<main class="shell">
<div class="heading"><h1>Order at<br> the <em>counter.</em></h1><p>Choose a favourite, make it yours and build your basket.</p></div>
<div class="layout">
<section class="list" aria-labelledby="menu-title">
<div class="category-picker"><label id="menu-title" for="category">Menu</label><select id="category"></select></div>
<div class="menu-grid" id="menu-grid"></div>
</section>
<aside class="receipt" id="receipt" tabindex="-1" aria-labelledby="receipt-title">
<h2 id="receipt-title">Your basket</h2>
<p id="empty">Your basket is empty.</p>
<ul class="receipt-lines" id="lines"></ul>
<div class="receipt-total"><span>Total</span><span id="total">£0.00</span></div>
<p class="feedback" id="feedback" role="status"></p>
</aside>
</div>
</main>
<dialog id="builder" aria-labelledby="builder-title">
<form id="builder-form">
<div class="dialog-head"><h2 id="builder-title"></h2><button type="button" class="close" id="close">Close</button></div>
<div class="dialog-body" id="builder-body"></div>
<div class="dialog-footer"><output id="builder-price"></output><button class="primary" type="submit">Add to basket</button></div>
</form>
</dialog>
<script type="module">
import {catalog, createDefaultSelections, formatPrice, getUnitPricePence} from '/charcoal-demo/catalog.js';
const $=id=>document.getElementById(id);
const basket=[];
let active;
const normalise=image=>image?.startsWith('../')?'/'+image.slice(3):'/charcoal-demo/'+image?.replace(/^\.\//,'');
const prototypePhotos={chips:'chips',nuggets:'nugget',shish:'shish-grilled-chicken'};
const productPhoto=product=>prototypePhotos[product.categoryId]
 ? '/charcoal-demo/assets/menu/'+prototypePhotos[product.categoryId]+'.webp'
 : normalise(product.image);
const make=(name,attrs={},text='')=>{const node=document.createElement(name);Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,value));node.textContent=text;return node};
const groups=[{id:'all',name:'All products'},...catalog.categories.filter(group=>catalog.products.some(product=>product.categoryId===group.id))];
for(const group of groups)$('category').append(make('option',{value:group.id},group.name));
const featured=['half-pounder-with-cheese','hot-dog','chips','chicken-shish-medium'];
function showMenu(){
 const id=$('category').value;
 const products=catalog.products.filter(product=>id==='all'||product.categoryId===id);
 if(id==='all')products.sort((a,b)=>(featured.includes(a.id)?featured.indexOf(a.id):99)-(featured.includes(b.id)?featured.indexOf(b.id):99));
 $('menu-grid').replaceChildren();
 for(const product of products){
  const card=make('button',{type:'button',class:'menu-card'});
  const photo=make('div',{class:'photo'});
  if(product.image)photo.append(make('img',{src:productPhoto(product),alt:'',loading:'lazy'}));
  const details=make('span',{class:'details'});
  details.append(make('span',{class:'name'},product.name),make('span',{class:'price'},formatPrice(product.basePricePence)));
  card.append(photo,details);
  card.addEventListener('click',()=>showProduct(product));
  $('menu-grid').append(card);
 }
}
function currentSelection(){
 return new Set([...$('builder-body').querySelectorAll('input:checked')].map(input=>input.value));
}
function showProduct(product){
 active=product;
 $('builder-title').textContent=product.name;
 const body=$('builder-body');
 body.replaceChildren();
 if(product.image)body.append(make('img',{src:productPhoto(product),alt:'',class:'builder-preview'}));
 const defaults=createDefaultSelections(product);
 const options=make('div',{class:'options'});
 for(const group of product.optionGroups){
  const visible=group.options.filter(option=>!option.locked);
  if(!visible.length)continue;
  const field=make('fieldset');
  field.append(make('legend',{},group.name));
  if(group.min)field.append(make('p',{class:'required'},group.max===1?'Choose one.':'Choose at least one.'));
  const grid=make('div',{class:'option-grid'});
  if(group.max===1&&group.min===0){
   const label=make('label',{},group.id==='size'?'Standard':'No preference');
   const input=make('input',{type:'radio',name:group.id,value:''});
   input.checked=!visible.some(choice=>defaults.has(choice.id));
   label.prepend(input);
   grid.append(label);
  }
  for(const choice of visible){
   const input=make('input',{type:group.max===1?'radio':'checkbox',name:group.id,value:choice.id});
   input.checked=defaults.has(choice.id);
   if(group.min===1&&group.max===1)input.required=true;
   const label=make('label',{},choice.name);
   label.prepend(input);
   if(choice.pricePence)label.append(make('small',{},'+'+formatPrice(choice.pricePence)));
   grid.append(label);
  }
  field.append(grid);
  options.append(field);
 }
 body.append(options,make('p',{class:'feedback',id:'choice-feedback',role:'status'}));
 updatePrice();
 $('builder').showModal();
}
function updatePrice(){$('builder-price').textContent=formatPrice(getUnitPricePence(active,currentSelection()));}
function showBasket(){
 $('empty').hidden=Boolean(basket.length);
 $('count').textContent=basket.length;
 $('total').textContent=formatPrice(basket.reduce((sum,line)=>sum+line.price,0));
 $('lines').replaceChildren(...basket.map(line=>{
  const item=make('li');
  item.append(make('strong',{},line.name),make('span',{},formatPrice(line.price)));
  if(line.options.length)item.append(make('small',{},line.options.join(', ')));
  return item;
 }));
}
$('builder-form').addEventListener('submit',event=>{
 event.preventDefault();
 const selection=currentSelection();
 for(const group of active.optionGroups){
  const chosen=group.options.filter(option=>selection.has(option.id));
  if(chosen.length<group.min){
   $('choice-feedback').textContent='Please choose from '+group.name.toLowerCase()+'.';
   return;
  }
 }
 const options=active.optionGroups.flatMap(group=>group.options.filter(option=>selection.has(option.id)).map(option=>option.name));
 basket.push({name:active.name,price:getUnitPricePence(active,selection),options});
 $('feedback').textContent=active.name+' added.';
 $('builder').close();
 showBasket();
});
$('builder-body').addEventListener('change',updatePrice);
$('close').addEventListener('click',()=>$('builder').close());
$('basket-link').addEventListener('click',()=>$('receipt').focus());
$('category').addEventListener('change',showMenu);
showMenu();
</script>
</html>
