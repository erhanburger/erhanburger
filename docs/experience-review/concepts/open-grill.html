<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f1e4">
<title>Open Grill · Er-Han Burger</title>
<style>
:root{--ink:#291d15;--muted:#665244;--cream:#f7f1e4;--paper:#fffaf0;--rouge:#9d3625;--line:#d9cbb8;--night:#21150f;--radius:18px}*{box-sizing:border-box}html{scroll-padding-top:85px}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 system-ui,sans-serif}a{color:inherit}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b85138;outline-offset:4px}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,serif;font-weight:600;letter-spacing:-.065em;line-height:.96}.shell{width:min(1320px,calc(100% - 96px));margin-inline:auto}.header{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}.header .shell{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font:900 1.35rem/1 system-ui,sans-serif;letter-spacing:-.065em;text-decoration:none}.brand span{color:var(--rouge)}.navigation{display:flex;align-items:center;gap:24px}.navigation a{text-decoration:none;font-weight:650;font-size:.9rem}.navigation a:hover{text-decoration:underline}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:8px 18px;border:1px solid transparent;border-radius:8px;background:var(--rouge);color:white;font-weight:750;text-decoration:none}.button:hover{background:#793323}.button.secondary{border-color:var(--line);background:transparent;color:var(--ink)}.button.secondary:hover{background:#f3e5d4}.hero{display:grid;grid-template-columns:.95fr 1.05fr;align-items:stretch;padding:42px 0 50px}.hero-copy{padding:clamp(22px,6vw,90px) 36px clamp(22px,5vw,80px) 0;align-self:center}.eyebrow{margin-bottom:14px;color:var(--rouge);font-size:.76rem;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(3.7rem,7.6vw,7.9rem)}.hero h1 em{color:var(--rouge);font-style:italic}.hero-copy p{max-width:370px;margin:20px 0 26px;color:var(--muted);font-size:1.04rem}.hero-photo{position:relative;overflow:hidden;display:grid;place-items:center;min-height:484px;border-radius:26px;background:radial-gradient(ellipse at 48% 45%,#794629 0%,#4b281b 43%,#21150f 78%)}.hero-photo img{width:min(81%,505px);height:auto;filter:drop-shadow(0 35px 32px #180b07);object-fit:contain}.hero-photo::after{content:"";position:absolute;inset:0;border:1px solid #c1875738;border-radius:inherit;pointer-events:none}.hero-caption{position:absolute;inset:auto 20px 18px;color:#fff0dc;font:600 .83rem system-ui}.menu-section{padding:0 0 54px}.section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}.section-heading h2,.builder-copy h2{font-size:clamp(2.7rem,4.7vw,5.1rem)}.section-heading a{font-weight:750;color:var(--rouge);text-underline-offset:4px}.menu-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{text-align:left;overflow:hidden;padding:0;border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);background:var(--paper)}.card:hover,.card[aria-pressed=true]{border-color:var(--rouge)}.card[aria-pressed=true]{outline:2px solid var(--rouge);outline-offset:-2px}.card-media{height:160px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#eed8bd,#f0e3cf);padding:13px}.card-media img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 10px #70472737)}.card-info{display:flex;gap:9px;justify-content:space-between;align-items:flex-start;padding:14px 14px 17px;min-height:65px}.card-info strong{font-size:.95rem}.card-info span{white-space:nowrap;color:var(--rouge);font-weight:790}.builder-section{background:#efe4d2;border-block:1px solid var(--line);padding:44px 0 52px}.builder{display:grid;grid-template-columns:1.02fr .98fr;gap:35px}.builder-visual{position:sticky;top:94px;align-self:start;min-height:460px;display:grid;place-items:center;color:#fdf2e5;overflow:hidden;background:radial-gradient(ellipse at 52% 55%,#75432a,#3a2217 63%,#20140d);border-radius:23px}.builder-visual::before{content:"";position:absolute;bottom:14%;width:75%;height:11%;border-radius:50%;filter:blur(24px);background:#100802}.stage-item{display:block;position:relative;width:min(77%,380px);max-height:390px;object-fit:contain;filter:drop-shadow(0 15px 10px #21110a99)}.stage-stack{position:relative;width:min(72%,330px);aspect-ratio:1.1;filter:drop-shadow(0 16px 14px #1a0d08)}.stage-stack img{position:absolute;width:90%;left:5%;object-fit:contain}.stage-stack .bun{bottom:2%;z-index:1}.stage-stack .patty{bottom:21%;z-index:2}.stage-stack .patty.second{bottom:29%;z-index:3}.stage-stack .cheese{bottom:39%;z-index:4;width:84%;left:8%}.stage-stack .lettuce{bottom:45%;z-index:5;width:96%;left:2%}.stage-stack .top{bottom:48%;z-index:6}.stage-stack.replay img{animation:assemble .54s cubic-bezier(.2,.72,.3,1) both;animation-delay:calc(var(--order)*85ms)}@keyframes assemble{from{opacity:0;transform:translateY(-42px)}to{opacity:1;transform:translateY(0)}}.builder-visual figcaption{position:absolute;bottom:17px;left:20px;font-size:.83rem}.builder-visual .replay{position:absolute;bottom:13px;right:15px;padding:8px 11px;min-height:40px;border-radius:8px;border:1px solid #ead0ab75;background:#fff0d21a;color:#fff8ee}.builder-copy>p{margin:14px 0 22px;color:var(--muted)}.option-group{border:0;border-top:1px solid var(--line);margin:0;padding:15px 0 19px}.option-group legend{float:left;width:100%;font-weight:800;margin-bottom:10px}.options{display:grid;gap:8px;clear:both;grid-template-columns:repeat(2,minmax(0,1fr))}.option{display:flex;text-align:left;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:650;font-size:.91rem}.option[aria-pressed=true]{border-color:var(--rouge);background:#f8dec9}.option span{font-size:.76rem;color:var(--rouge);white-space:nowrap}.builder-bar{display:flex;justify-content:space-between;align-items:center;gap:13px;padding-top:14px;border-top:1px solid var(--line)}.builder-bar small{display:block;color:var(--muted)}.builder-bar strong{font-size:1.57rem}.builder .builder-visual{margin:0}.footer{padding:25px 0;color:var(--muted);font-size:.9rem}.footer .shell{display:flex;justify-content:space-between;gap:20px}dialog{width:min(460px,calc(100% - 24px));padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--cream);color:var(--ink)}dialog::backdrop{background:#24150b99}dialog h2{font-size:2.6rem}.dialog-head,.subtotal{display:flex;justify-content:space-between;align-items:center;gap:12px}.lines{padding:0;margin:12px 0;list-style:none}.lines li{display:grid;grid-template-columns:1fr auto;gap:7px;padding:14px 0;border-bottom:1px solid var(--line)}.lines p{font-size:.88rem;color:var(--muted)}.remove{padding:0;border:0;background:transparent;color:var(--rouge);text-decoration:underline}.subtotal{margin:14px 0}.empty{padding:20px 0;color:var(--muted)}@media(max-width:900px){.shell{width:calc(100% - 44px)}.hero-photo{min-height:410px}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:660px){.shell{width:calc(100% - 26px)}.header .shell{min-height:59px}.navigation{gap:11px}.navigation>a{display:none}.header .button{min-height:43px;padding-inline:12px;font-size:.89rem}.hero{display:flex;flex-direction:column;padding:22px 0 32px}.hero-copy{padding:15px 0 22px}.hero h1{font-size:clamp(3.75rem,15.3vw,5.5rem)}.hero-copy p{margin:13px 0 17px}.hero-photo{min-height:0;aspect-ratio:1.26;border-radius:17px}.hero-photo img{max-height:94%}.menu-section{padding-bottom:31px}.section-heading{align-items:start}.section-heading a{font-size:.8rem;max-width:88px}.menu-grid{gap:8px}.card-media{height:104px;padding:7px}.card-info{display:grid;gap:1px;padding:9px 8px 12px}.card-info strong{font-size:.84rem}.card-info span{font-size:.83rem}.builder-section{padding:25px 0 8px}.builder{display:flex;flex-direction:column;gap:18px}.builder-visual{top:59px;z-index:3;min-height:0;height:clamp(130px,29vh,230px);width:100%;border-radius:15px;box-shadow:0 8px 9px #33231338}.stage-stack{width:min(44%,181px);aspect-ratio:1.18}.stage-item{max-height:83%;width:min(56%,225px)}.builder-visual figcaption{font-size:.71rem;left:10px;bottom:10px}.builder-visual .replay{font-size:.72rem;padding:5px 7px;right:9px;bottom:9px}.builder-copy>p{margin-bottom:14px}.builder-bar{position:sticky;bottom:0;z-index:4;background:#efe4d2;padding:10px 0}.footer .shell{display:grid}.option{min-height:44px}}@media(prefers-reduced-motion:reduce){.stage-stack.replay img{animation:none}}
</style>
</head>
<body>
<header class="header"><div class="shell"><a class="brand" href="#">ER-HAN <span>BURGER</span></a><nav class="navigation" aria-label="Main navigation"><a href="#menu">Menu</a><a href="#prepare">Customise</a><button class="button secondary" id="basket-open">Basket <span id="count" aria-label="items">&nbsp;0</span></button></nav></div></header>
<main>
<section class="shell hero">
  <div class="hero-copy"><p class="eyebrow">Er-Han Burger · London</p><h1>Grill.<br><em>Build.</em><br>Bite.</h1><p>Pick your grill favourite, make it your own and watch your choices come together.</p><a class="button" href="#menu">Explore the menu</a></div>
  <figure class="hero-photo" style="margin:0"><img src="/IMG_0352.png" width="600" height="500" alt="Half Pounder burger with a toasted sesame bun"><figcaption class="hero-caption">Half Pounder with Cheese · £6.90</figcaption></figure>
</section>
<section class="shell menu-section" id="menu" aria-labelledby="menu-heading">
  <div class="section-heading"><h2 id="menu-heading">From the grill</h2><a href="/charcoal-demo/menu.html">See full menu</a></div>
  <div class="menu-grid" id="products"></div>
</section>
<section class="builder-section" id="prepare" aria-labelledby="product-name">
  <div class="shell builder">
    <figure class="builder-visual"><div id="stage"></div><figcaption>Preparation preview</figcaption><button type="button" class="replay" id="replay">Replay preparation</button></figure>
    <div class="builder-copy"><div class="eyebrow">Make it yours</div><h2 id="product-name"></h2><p id="description"></p><div id="product-options"></div>
      <div class="builder-bar"><div><small>Total</small><strong id="total" aria-live="polite"></strong></div><button class="button" id="add">Add to basket</button></div>
    </div>
  </div>
</section>
</main>
<footer class="footer"><div class="shell"><strong>Er-Han Burger</strong><span>Brent South Shopping Park, London</span></div></footer>
<dialog id="basket"><div class="dialog-head"><h2>Your basket</h2><form method="dialog"><button class="button secondary">Close</button></form></div><div id="basket-content"></div><form method="dialog"><button class="button">Continue shopping</button></form></dialog>
<script>
const food='/burger-builder-demo/assets/';
const cut='/charcoal-demo/assets/menu/';
const items=[
 {id:'half',name:'Half Pounder with Cheese',price:690,photo:'/IMG_0352.png',description:'Customise your burger with salads, extras and sauces.',groups:[['Toppings',[['lettuce','Lettuce',0],['extra','Extra cheese',30],['egg','Egg',60]]],['Sauces',[['ketchup','Ketchup',0],['mayo','Mayonnaise',0],['burger-sauce','Burger sauce',0]]]]},
 {id:'dog',name:'Hot Dog',price:470,photo:cut+'dog-overhead-sausage.webp',description:'Pick toppings and sauces for your open-roll hot dog.',groups:[['Toppings',[['extra','Extra cheese',30],['egg','Egg',60]]],['Sauces',[['ketchup','Ketchup',0],['mayo','Mayonnaise',0]]]]},
 {id:'shish',name:'Chicken Shish – Medium',price:980,photo:'/IMG_0457.jpeg',description:'Choose a chilli preference for your grilled chicken shish.',groups:[['Chilli preference',[['chilli','Chilli',0],['no-chilli','No chilli',0],['bbq','BBQ',0]]]],required:['chilli','no-chilli','bbq']},
 {id:'chips',name:'Chips',price:290,photo:cut+'chips.webp',description:'Choose your portion size, salt preference and sauce requests.',groups:[['Size',[['large','Make it large',100]]],['Salt preference',[['salt','Salt',0],['no-salt','No salt',0]]],['Sauce requests',[['ketchup','Ketchup',0],['mayo','Mayonnaise',0]]]]},
];
let selectedItem=items[0], choices=new Set(), basket=[];
const money=p=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(p/100);
const byId=id=>document.getElementById(id);
const lineOptions=()=>selectedItem.groups.flatMap(group=>group[1]).filter(option=>choices.has(option[0]));
const amount=()=>selectedItem.price+lineOptions().reduce((sum,option)=>sum+option[2],0);
function node(tag,cls,label){const n=document.createElement(tag);if(cls)n.className=cls;if(label)n.textContent=label;return n}
function renderCards(){
 const grid=byId('products');grid.replaceChildren();
 for(const item of items){
  const button=node('button','card');button.type='button';button.setAttribute('aria-pressed',String(item===selectedItem));
  const media=node('span','card-media');const image=node('img');image.src=item.id==='dog'?'/IMG_0353.png':item.photo;image.alt='';media.append(image);
  const label=node('span','card-info');label.append(node('strong','',item.name),node('span','',money(item.price)));
  button.append(media,label);button.onclick=()=>{selectedItem=item;choices=new Set();renderCards();renderBuilder();byId('prepare').scrollIntoView();};grid.append(button);
 }
}
function renderStage(animation){
 const stage=byId('stage');stage.replaceChildren();stage.style.display='contents';
 if(selectedItem.id==='half'){
  const stack=node('div','stage-stack'+(animation?' replay':''));
  const sprites=[['bun','bun'],['beef','patty'],['beef','patty second'],['cheese','cheese'],...(choices.has('lettuce')?[['lettuce','lettuce']]:[]),['top','top']];
  sprites.forEach(([file,cls],i)=>{const img=node('img',cls);img.src=food+file+'.webp';img.alt='';img.style.setProperty('--order',i);stack.append(img)});stage.append(stack);
 }else{
  const img=node('img','stage-item');img.src=selectedItem.id==='dog'?'/IMG_0353.png':selectedItem.photo;img.alt=selectedItem.name;
  if(selectedItem.id==='chips'&&choices.has('large'))img.style.transform='scale(1.13)';
  stage.append(img);
  if(animation&&!matchMedia('(prefers-reduced-motion: reduce)').matches)img.animate([{opacity:.4,translate:'0 -12px'},{opacity:1,translate:'0 0'}],230);
 }
}
function renderBuilder(){
 byId('product-name').textContent=selectedItem.name;byId('description').textContent=selectedItem.description;
 const panel=byId('product-options');panel.replaceChildren();
 for(const [title,options] of selectedItem.groups){
  const group=node('fieldset','option-group');const set=node('div','options');group.append(node('legend','',title),set);
  for(const [id,label,price] of options){
   const button=node('button','option',label);button.type='button';button.dataset.option=id;
   button.setAttribute('aria-pressed',String(choices.has(id)));const value=node('span','',price?'+'+money(price):'');button.append(value);
   button.onclick=()=>{if(choices.has(id))choices.delete(id);else{if(title==='Salt preference')options.forEach(o=>choices.delete(o[0]));choices.add(id)}renderBuilder();panel.querySelector('[data-option="'+id+'"]').focus({preventScroll:true});};
   set.append(button);
  }
  panel.append(group);
 }
 byId('total').textContent=money(amount());byId('add').disabled=!!selectedItem.required&&!selectedItem.required.some(id=>choices.has(id));
 renderStage(false);
}
function renderBasket(){
 byId('count').textContent=' '+basket.reduce((sum,line)=>sum+line.qty,0);
 const contents=byId('basket-content');contents.replaceChildren();
 if(!basket.length){contents.append(node('p','empty','Your basket is empty.'));return}
 const lines=node('ul','lines');
 for(const [i,line] of basket.entries()){
  const row=node('li');const copy=node('div');copy.append(node('strong','',line.qty+' × '+line.name));
  if(line.options.length)copy.append(node('p','',line.options.join(', ')));
  const aside=node('div');aside.append(node('strong','',money(line.price*line.qty)),node('br'));
  const remove=node('button','remove','Remove');remove.setAttribute('aria-label','Remove '+line.name);remove.onclick=()=>{basket.splice(i,1);renderBasket()};aside.append(remove);row.append(copy,aside);lines.append(row);
 }
 const subtotal=node('div','subtotal');subtotal.append(node('span','','Subtotal'),node('strong','',money(basket.reduce((sum,line)=>sum+line.price*line.qty,0))));contents.append(lines,subtotal);
}
byId('add').onclick=()=>{const options=lineOptions().map(o=>o[1]);const price=amount();const key=JSON.stringify([selectedItem.id,options]);const existing=basket.find(line=>line.key===key);if(existing)existing.qty++;else basket.push({key,name:selectedItem.name,options,price,qty:1});renderBasket();byId('basket').showModal();};
byId('basket-open').onclick=()=>{renderBasket();byId('basket').showModal()};
byId('replay').onclick=()=>renderStage(true);
renderCards();renderBuilder();renderBasket();
</script>
</body>
</html>
